<div class="bg-dark text-white py-2 border-bottom border-secondary border-opacity-25">
  <div class="container d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-2">
      <span class="badge bg-warning text-dark fw-bold">ADMIN PANEL</span>
      <span class="small text-secondary">Logged in as <strong>{{ adminUser?.name || 'Administrator' }}</strong> ({{ adminUser?.email }})</span>
    </div>

    <div class="d-flex align-items-center gap-2">
      <a routerLink="/" class="btn btn-sm btn-outline-light d-flex align-items-center gap-1">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Back to Storefront
      </a>
      <button (click)="logout()" class="btn btn-sm btn-outline-danger">Sign Out</button>
    </div>
  </div>
</div>

<header class="bg-white border-bottom shadow-sm sticky-top">
  <div class="container py-2 d-flex flex-wrap align-items-center justify-content-between gap-3">
    <a routerLink="/dashboard/home" class="d-flex align-items-center gap-2 text-decoration-none">
      <div class="bg-dark text-white p-2 rounded-3 d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
      </div>
      <span class="fs-5 fw-bold text-dark">Management Console</span>
    </a>

    <ul class="nav nav-pills gap-1">
      <li class="nav-item">
        <a routerLink="home" class="nav-link py-2 px-3 small fw-semibold" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
          Overview & Alerts
        </a>
      </li>
      <li class="nav-item">
        <a routerLink="orders" class="nav-link py-2 px-3 small fw-semibold" routerLinkActive="active">
          Orders (COD)
        </a>
      </li>
      <li class="nav-item">
        <a routerLink="products" class="nav-link py-2 px-3 small fw-semibold" routerLinkActive="active">
          Products
        </a>
      </li>
      <li class="nav-item">
        <a routerLink="categories" class="nav-link py-2 px-3 small fw-semibold" routerLinkActive="active">
          Categories
        </a>
      </li>
      <li class="nav-item">
        <a routerLink="user-list" class="nav-link py-2 px-3 small fw-semibold" routerLinkActive="active">
          Users & Admins
        </a>
      </li>
      <li class="nav-item">
        <a routerLink="testimonials" class="nav-link py-2 px-3 small fw-semibold" routerLinkActive="active">
          Testimonials
        </a>
      </li>
      <li class="nav-item">
        <a routerLink="faqs" class="nav-link py-2 px-3 small fw-semibold" routerLinkActive="active">
          FAQs
        </a>
      </li>
    </ul>
  </div>
</header>
